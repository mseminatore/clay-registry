name: Check

on:
  pull_request:
    paths: ["bricks/**"]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily: pick up new brick versions and re-test every brick
  workflow_dispatch:       # "Run workflow" on the Actions page, to refresh the index now

permissions:
  contents: write          # the push job commits index.json and the README table

jobs:
  entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Changed entries
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}... -- 'bricks/*.json' | tr '\n' ' ')
          else
            files=$(ls bricks/*.json | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Validate every entry
        run: python3 -I scripts/check.py

      - name: Clone the changed bricks and read their brick.json
        if: steps.changed.outputs.files != ''
        run: python3 -I scripts/check.py --fetch ${{ steps.changed.outputs.files }}

      - name: Build Clay
        if: steps.changed.outputs.files != ''
        run: |
          git clone --depth 1 --recurse-submodules --quiet https://github.com/mseminatore/clay /tmp/clay
          cmake -S /tmp/clay -B /tmp/clay/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON
          cmake --build /tmp/clay/build --target clay_compiler -j4

      # The brick is installed and imported from a project of its own, the way a user would.
      # A native brick is built here (C code from the listed repository runs in this job only).
      - name: Install and import the changed bricks
        if: steps.changed.outputs.files != ''
        run: |
          set -e
          for f in ${{ steps.changed.outputs.files }}; do
            name=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "$f")
            repo=$(python3 -I -c "import json,sys; print(json.load(open(sys.argv[1]))['repo'])" "$f")
            rm -rf /tmp/proj && mkdir /tmp/proj && cd /tmp/proj
            /tmp/clay/build/clay bricks init
            /tmp/clay/build/clay bricks add "$repo" "$name" --yes   # a native brick builds here, knowingly
            printf 'import("%s")\n"%s imports" println\n' "$name" "$name" > try.clay
            /tmp/clay/build/clay try.clay
            if ls bricks/$name/tests/test_*.clay >/dev/null 2>&1; then
              for t in bricks/$name/tests/test_*.clay; do /tmp/clay/build/clay "$t"; done
            fi
            cd -
          done

      # The generated files live on the unprotected `index` branch (main only takes
      # pull requests): index.json is what `clay bricks search` fetches, BRICKS.md the
      # same list for people. Rebuilt from main on every push, daily and on request, so a
      # brick's new version shows up without a change here.
      - name: Publish index.json and BRICKS.md to the index branch
        if: github.event_name != 'pull_request'
        run: |
          python3 -I scripts/check.py --fetch bricks/*.json
          python3 -I scripts/check.py --index
          mkdir /tmp/index && cp index.json BRICKS.md /tmp/index/
          cd /tmp/index
          git init --quiet -b index
          git config user.name "clay-registry bot"
          git config user.email "noreply@users.noreply.github.com"
          git add index.json BRICKS.md
          git commit --quiet -m "index from main ${{ github.sha }}"
          git push --force --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" index
